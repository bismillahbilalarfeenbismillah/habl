# Bismillah ir-Rahman ir-Rahim
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "habl"
version = "0.1.0"
description = "Honesty-Attested Binding Ledger -- the mycorrhizal connective tissue of the Bayyinah structural-honesty stack"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "BayyinahEnterprise" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/bismillahbilalarfeenbismillah/habl"

[tool.setuptools.packages.find]
where = ["."]
include = ["habl*"]
# Bismillah ir-Rahman ir-Rahim
